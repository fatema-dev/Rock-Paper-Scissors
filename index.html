<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rock Paper Scissors</title>
		<style rel="stylesheet" src="style.css"></style>
		<script defer src="script.js"></script>
	</head>
	<body>
		<div class="container">
		<div class="title">
		<h1>Rock Paper Scissors</h1>
		</div>
		<div class="gameplay">
			<div id="user">
				<button type="button" id="rockbtn"> Rock </button>
				<button type="button" id ="paperbtn"> Paper </button>
				<button type="button" id="scisbtn"> Scissors </button>
				<button type="button" id="reset"> reset game</button>
			</div>

			<div id="bot">
				<p>Opponent is selecting an option...</p>
			</div>
		</div>
		</div>
		
	</body>
</html>
