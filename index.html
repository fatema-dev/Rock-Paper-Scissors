<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rock Paper Scissors</title>
		<link rel="stylesheet" href="style.css" />
		<script defer src="script.js"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div class="title">
			<div class="web-title">
				<span>Rock</span>
				<span>Paper</span>
				<span>Scissors</span>
			</div>
			<div class="emoji-row"><span>🪨</span><span>📄</span><span>✂️</span></div>
		</div>

		<div class="container">
			<div id="selection">
				<button type="button" id="rockbtn">Rock</button>
				<button type="button" id="paperbtn">Paper</button>
				<button type="button" id="scisbtn">Scissors</button>
				<button type="button" id="reset">Reset</button>
				<button type="button" id="score">View Score</button>
			</div>

			<div id="bot">
				<p>Opponent is selecting an option...</p>
			</div>

			<div class="gameplay"></div>
		</div>
	</body>
</html>
